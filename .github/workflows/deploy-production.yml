name: Deploy to Production

# DISABLED at VS-000 — see docs/architecture/adr/ADR-0008-DEPLOYMENT-WORKFLOWS.md
#
# Inherited from the Full Stack FastAPI Template. It targets self-hosted
# runners labelled "production" which do not exist for this project, and its
# only guard was `github.repository_owner != 'fastapi'` — a condition that
# PASSES on this fork, so publishing a release would have attempted a real
# deployment using placeholder secrets (.env still contains three
# `changethis` values).
#
# The original trigger is preserved below. Re-enable at VS-019, and only
# once a real deployment target exists, the secrets are replaced, and a
# rehearsed restore and rollback procedure are documented.
#
# on:
#   release:
#     types:
#       - published

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    environment: production
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - production
    env:
      ENVIRONMENT: production
      DOMAIN: ${{ secrets.DOMAIN_PRODUCTION }}
      STACK_NAME: ${{ secrets.STACK_NAME_PRODUCTION }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_PRODUCTION }} build
      - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_PRODUCTION }} up -d
