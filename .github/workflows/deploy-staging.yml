name: Deploy to Staging

# DISABLED at VS-000 — see docs/architecture/adr/ADR-0008-DEPLOYMENT-WORKFLOWS.md
#
# Inherited from the Full Stack FastAPI Template. It targets self-hosted
# runners labelled "staging" which do not exist for this project, and its
# only guard was `github.repository_owner != 'fastapi'` — a condition that
# PASSES on this fork, so it would have run on every push to master using
# placeholder secrets (.env still contains three `changethis` values).
#
# The original trigger is preserved below. Re-enable at VS-019, and only
# once a real deployment target exists and the secrets are replaced.
#
# on:
#   push:
#     branches:
#       - master

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    environment: staging
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - staging
    env:
      ENVIRONMENT: staging
      DOMAIN: ${{ secrets.DOMAIN_STAGING }}
      STACK_NAME: ${{ secrets.STACK_NAME_STAGING }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_STAGING }} build
      - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_STAGING }} up -d
